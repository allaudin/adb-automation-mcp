site_name: adb-automation-mcp
site_description: MCP server that lets Claude and other AI agents control Android devices over ADB with typed, documented, policy-controlled tools.
site_author: Allaudin Muhammad
site_url: https://allaudin.github.io/adb-automation-mcp/
repo_url: https://github.com/allaudin/adb-automation-mcp
repo_name: allaudin/adb-automation-mcp
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# mkdocstrings pulls tool docstrings straight from src/ (see the Tool
# Reference nav below) — without this, `mkdocs serve`'s live-reload only
# watches docs_dir/mkdocs.yml and silently keeps serving stale docstring
# content after a .py file changes, since git isn't otherwise involved.
watch:
  - src

# Contributor-facing design docs — kept in the repo, not part of the public site.
exclude_docs: |
  ADR.md
  ARCHITECTURE.md

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/extra.js

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Integrations:
      - Claude Code: integrations/claude-code.md
      - AI-Assisted Install: integrations/ai-assisted-install.md
  - Tool Reference:
      - Overview: reference/index.md
      - Devices & Connection:
          - Device Info: reference/device_info.md
          - Connection: reference/connection.md
          - Diagnostics: reference/diagnostics.md
          - Port Forwarding: reference/port_forwarding.md
          - Power: reference/power.md
          - Date & Time: reference/date_time.md
      - Apps:
          - Packages: reference/packages.md
          - Activities: reference/activities.md
          - Services: reference/android_services.md
          - Broadcasts: reference/broadcasts.md
          - Permissions: reference/permissions.md
          - App Data: reference/app_data.md
          - Processes: reference/processes.md
          - Content Providers: reference/content.md
          - Instrumentation Tests: reference/instrumentation.md
      - Screen & Interaction:
          - Screenshots & Recording: reference/screen.md
          - Input: reference/input.md
          - UI Inspection: reference/ui.md
          - Displays: reference/displays.md
      - Device Configuration:
          - Settings: reference/settings.md
          - System Properties: reference/system_properties.md
          - Users: reference/user.md
          - Network: reference/network.md
      - Files:
          - Files: reference/files.md
      - Logs & Debugging:
          - Logs (logcat): reference/logger.md
          - ANR Reports: reference/anr.md
          - Debugging: reference/debugging.md
      - Performance:
          - Memory: reference/memory.md
          - Graphics & Frame Stats: reference/graphics.md
          - Method Profiling: reference/profiling.md
          - System Tracing: reference/tracing.md
          - Binder IPC: reference/binder.md

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # Required for Material to render ```mermaid fences as actual diagrams
      # instead of plain code blocks.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            # Reader-facing reference: no source listings, no module heading
            # (each page has its own H1), and no signature line — the
            # Parameters table covers every argument, and the signature would
            # otherwise expose the internal `ctx: Context` parameter.
            show_source: false
            show_root_heading: false
            show_signature: false
            show_symbol_type_heading: false
            show_symbol_type_toc: false
            show_labels: false
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true
            docstring_options:
              # This project's docstrings are deliberately narrative
              # prose, tuned for LLM/human readability — not griffe's stricter
              # "ExceptionType: description" structured Raises/Returns items.
              # Suppress griffe's parsing warnings rather than reshaping the
              # docstring convention around one tool's parser.
              warnings: false
              # Every tool here returns exactly one value, documented as a
              # single flush-left paragraph (no hanging indent). Without this,
              # griffe treats each physical line of that paragraph as a
              # separate "Returns" item, rendering as one bogus table row per
              # line instead of one row for the whole description.
              returns_multiple_items: false
