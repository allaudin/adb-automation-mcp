[project]
name = "adb-mcp-server"
version = "0.1.0"
description = "MCP server exposing Android Debug Bridge (ADB) capabilities as tools and resources."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=3.0",
    "pydantic>=2.0",
]

[project.scripts]
adb-mcp-server = "adb_mcp.server:main"

[project.entry-points."adb_mcp.modules"]
diagnostics = "adb_mcp.modules.diagnostics.manifest:MODULE"
device_info = "adb_mcp.modules.device_info.manifest:MODULE"
connection = "adb_mcp.modules.connection.manifest:MODULE"
user = "adb_mcp.modules.user.manifest:MODULE"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "docstring-parser>=0.16",
    "mypy>=1.11",
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adb_mcp"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
