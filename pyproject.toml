[project]
name = "adb-automation-mcp"
version = "1.0.0"
description = "MCP server exposing Android Debug Bridge (ADB) capabilities as tools and resources."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "M. Allaudin", email = "dev.allaudin@gmail.com" },
]
keywords = [
    "adb",
    "android",
    "android-debug-bridge",
    "mcp",
    "model-context-protocol",
    "fastmcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastmcp>=3.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/allaudin/adb-automation-mcp"
Repository = "https://github.com/allaudin/adb-automation-mcp"
Documentation = "https://allaudin.github.io/adb-automation-mcp/"
Issues = "https://github.com/allaudin/adb-automation-mcp/issues"

[project.scripts]
adb-automation-mcp = "adb_automation_mcp.server:main"

[project.entry-points."adb_automation_mcp.modules"]
diagnostics = "adb_automation_mcp.modules.diagnostics.manifest:MODULE"
device_info = "adb_automation_mcp.modules.device_info.manifest:MODULE"
connection = "adb_automation_mcp.modules.connection.manifest:MODULE"
user = "adb_automation_mcp.modules.user.manifest:MODULE"
logger = "adb_automation_mcp.modules.logger.manifest:MODULE"
system_properties = "adb_automation_mcp.modules.system_properties.manifest:MODULE"
packages = "adb_automation_mcp.modules.packages.manifest:MODULE"
activities = "adb_automation_mcp.modules.activities.manifest:MODULE"
broadcasts = "adb_automation_mcp.modules.broadcasts.manifest:MODULE"
android_services = "adb_automation_mcp.modules.android_services.manifest:MODULE"
processes = "adb_automation_mcp.modules.processes.manifest:MODULE"
files = "adb_automation_mcp.modules.files.manifest:MODULE"
app_data = "adb_automation_mcp.modules.app_data.manifest:MODULE"
screen = "adb_automation_mcp.modules.screen.manifest:MODULE"
permissions = "adb_automation_mcp.modules.permissions.manifest:MODULE"
settings = "adb_automation_mcp.modules.settings.manifest:MODULE"
displays = "adb_automation_mcp.modules.displays.manifest:MODULE"
power = "adb_automation_mcp.modules.power.manifest:MODULE"
network = "adb_automation_mcp.modules.network.manifest:MODULE"
date_time = "adb_automation_mcp.modules.date_time.manifest:MODULE"
input = "adb_automation_mcp.modules.input.manifest:MODULE"
ui = "adb_automation_mcp.modules.ui.manifest:MODULE"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "docstring-parser>=0.16",
    "mypy>=1.11",
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adb_automation_mcp"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
